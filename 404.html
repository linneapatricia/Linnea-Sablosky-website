<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — Linnea Sablosky</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <style>
    .missing {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: var(--pad);
      padding-bottom: clamp(2.5rem, 10vh, 5.5rem);
      color: var(--paper);
      overflow: hidden;
    }

    .missing-photo {
      position: absolute;
      inset: 0;
      z-index: -2;
      margin: 0;
    }

    .missing-photo picture,
    .missing-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 45% 28%;
      display: block;
      animation: missing-drift 18s ease-in-out alternate infinite;
    }

    .missing::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(
          105deg,
          color-mix(in srgb, var(--ink) 55%, transparent) 0%,
          color-mix(in srgb, var(--ink) 18%, transparent) 48%,
          transparent 72%
        ),
        linear-gradient(
          180deg,
          transparent 28%,
          color-mix(in srgb, var(--ink) 45%, transparent) 68%,
          color-mix(in srgb, var(--ink) 78%, transparent) 100%
        );
      pointer-events: none;
    }

    .missing-brand {
      margin: 0 0 0.75rem;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(0.95rem, 2.4vw, 1.15rem);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.9;
      animation: missing-rise 0.9s ease-out both;
    }

    .missing-code {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(5.5rem, 22vw, 12rem);
      line-height: 0.85;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--yellow);
      animation: missing-rise 0.9s ease-out 0.08s both;
    }

    .missing-line {
      margin: 1rem 0 0;
      max-width: 22rem;
      font-size: clamp(1.05rem, 2.4vw, 1.3rem);
      line-height: 1.4;
      opacity: 0.92;
      animation: missing-rise 0.9s ease-out 0.16s both;
    }

    .missing .actions {
      margin: 1.6rem 0 0;
      animation: missing-rise 0.9s ease-out 0.24s both;
    }

    .missing .btn {
      background: var(--yellow);
      color: var(--ink);
      border-color: var(--yellow);
    }

    @keyframes missing-rise {
      from {
        opacity: 0;
        transform: translateY(1.1rem);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes missing-drift {
      from {
        transform: scale(1.04) translate3d(0, 0, 0);
      }
      to {
        transform: scale(1.1) translate3d(-1.5%, -1%, 0);
      }
    }

    @media (max-width: 640px) {
      .missing-photo img {
        object-position: 42% 22%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .missing-brand,
      .missing-code,
      .missing-line,
      .missing .actions,
      .missing-photo img {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="missing">
    <figure class="missing-photo" aria-hidden="true">
      <picture>
        <source srcset="images/portrait2.webp" type="image/webp">
        <img
          src="images/portrait2.jpg"
          alt=""
          width="1600"
          height="1066"
          decoding="async"
          fetchpriority="high"
        >
      </picture>
    </figure>

    <p class="missing-brand">Linnea Sablosky</p>
    <h1 class="missing-code">404</h1>
    <p class="missing-line">This page isn’t on the setlist.</p>
    <p class="actions">
      <a class="btn" href="index.html">Back home</a>
    </p>
  </main>
</body>
</html>
